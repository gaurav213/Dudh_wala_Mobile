name: doodh_khata_mobile
description: Doodh Wala — offline-first milk delivery marketplace for farms and customers.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  drift: ^2.25.0
  drift_flutter: ^0.2.4
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  decimal: ^3.0.2
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  drift_dev: ^2.25.0
  mockito: ^5.4.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
